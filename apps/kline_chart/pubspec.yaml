name: kline_chart_app
description: "K Line Chart - Binance K-line visualization app"
publish_to: 'none'
version: 1.0.0
resolution: workspace

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  go_router: ^17.0.0
  intl: ^0.20.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.8.1


  # Chart Library
  fl_chart: ^0.69.0

  # Network & WebSocket
  web_socket_channel: ^3.0.1

  # Core packages
  lt_network:
    path: ../../packages/core/network

  # Domain packages
  wallet_domain:
    path: ../../packages/domain/wallet_domain
  wallet_data:
    path: ../../packages/data/wallet_data

  # Feature packages
  wallets:
    path: ../../packages/features/wallets

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
